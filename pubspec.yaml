name: planner_app
description: Планировщик с голосовым ассистентом (MVP, offline-first)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  http: ^1.2.2
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  # Камера для фото-подтверждений шагов. Пин 1.1.2: последняя версия,
  # совместимая с Dart 3.5 (1.2.0 требует ^3.6, 1.2.4 — ^3.11).
  image_picker: 1.1.2
  # Сохранение сделанных фото в системную галерею (MediaStore, без
  # лишних разрешений). Пин 2.3.2: 3.0.0 требует Dart ^3.11.
  gal: 2.3.2
  # Офлайн-распознавание русской речи (sherpa-onnx) + запись PCM с микрофона.
  # Системный Google-распознаватель НЕ используется: никаких error_network /
  # error_speech_timeout. Пины точные — сборка воспроизводима.
  sherpa_onnx: 2.0.1
  # Пин ровно 6.2.1: у 5.2.1 внутренне несовместимое семейство — record_linux
  # зажат в <1.0.0 (0.7.2), который не реализует свежий record_platform_interface
  # (startStream/hasPermission), и сборка падает на этапе Dart-компиляции.
  # 6.2.1 тянет согласованное семейство (record_linux ^1.3.1, rpi ^1.6.0),
  # требует Dart ^3.5.0 — совместимо с нашим Flutter 3.24.5. API AudioRecorder
  # (hasPermission/startStream/stop) не изменился.
  record: 6.2.1
  # Стандартное (системное) распознавание речи — резервный канал,
  # когда офлайн-модель голоса не скачана (выбор «Позже»). Пин 7.4.0:
  # последняя версия, совместимая с Dart 3.5 (7.5.0 требует ^3.12).
  speech_to_text: 7.4.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  # Пин ровно 5.3.1: в 6.x build.gradle плагина требует flutter.compileSdkVersion
  # (Flutter >= 3.27), а мы на Flutter 3.24.5 — иначе сборка падает с
  # "unknown property 'flutter' for extension 'android'".
  android_intent_plus: 5.3.1
  fllama: 0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/beach_dayoff.png
    # Картинки блоков экрана «Путь» (по одной сцене на группу значков).
    - assets/path/
